name: Test Vokawa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npx playwright test --config=playwright.webkit.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-browser-results
          path: test-results/
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/test_backend.py tests/test_cantonese_speech.py tests/test_speech_api.py -q
