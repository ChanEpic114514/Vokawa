<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c0e17"><title>Vokawa · 更新 / Update</title>
<style>body{margin:0;background:#0c0e17;color:#eceafa;font:16px/1.7 system-ui;display:grid;min-height:100svh;place-items:center}main{max-width:520px;padding:28px}button,a{font:inherit;color:inherit}button{background:#bba8ff;color:#161025;border:0;border-radius:16px;padding:14px 22px;cursor:pointer}button:disabled{opacity:.5}p{color:#bab6cf}a{display:inline-block;margin-top:16px}h1{letter-spacing:-.04em}#status{white-space:pre-line}</style></head>
<body><main><h1>Vokawa · 0.6.2</h1><p>更新应用，不会删除已保存的咒语和历史记录。请先完成正在进行的录音。<br>Update the app without deleting saved wake phrases or history. Finish any recording first.</p><button id="update">更新并打开 / Update &amp; open</button><p id="status" role="status">请保持联网。 / Stay connected.</p><a href="../">返回 / Back</a></main>
<script>
// This path is excluded by the legacy worker's navigation fallback.
const button = document.getElementById('update');
const status = document.getElementById('status');
const root = new URL('../', location.href);
button.addEventListener('click', async () => {
  button.disabled = true;
  status.textContent = '正在检查更新… / Checking for updates…';
  let timer;
  try {
    await Promise.race([
      (async () => {
        if (!('serviceWorker' in navigator)) return;
        const registration = await navigator.serviceWorker.register(new URL('sw.js', root), { scope: root.pathname, updateViaCache: 'none' });
        await registration.update();
        const worker = registration.installing || registration.waiting;
        if (worker) await new Promise((resolve, reject) => {
          const check = () => {
            if (worker.state === 'installed') worker.postMessage({ type: 'SKIP_WAITING' });
            if (worker.state === 'activated' || worker.state === 'redundant') {
              worker.removeEventListener('statechange', check);
              worker.state === 'activated' ? resolve() : reject(new Error('Installation failed'));
            }
          };
          worker.addEventListener('statechange', check);
          check();
        });
        if (!registration.active) throw new Error('No active worker');
      })(),
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Update timeout')), 45000); })
    ]);
    status.textContent = '更新完成，正在打开… / Updated. Opening…';
    root.searchParams.set('updated', Date.now().toString());
    location.replace(root.href);
  } catch (error) {
    status.textContent = '更新未完成，请保持联网后重试。 / Update did not finish. Check your connection and retry.\n' + String(error);
    button.disabled = false;
  } finally { clearTimeout(timer); }
});
</script></body></html>
